<!doctype html>
<html lang="vi" data-theme-key="kieu_theme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Truyện Kiều — Nguyên văn & Giải nghĩa</title>
<meta name="description" content="Đọc nguyên văn 3.254 câu Truyện Kiều của Nguyễn Du cùng chú giải, diễn biến tâm lý và phân tích theo từng trường đoạn.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Truyện Kiều">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="js/site.js?v=20261007-2"></script>
<link rel="stylesheet" href="css/site.css?v=20261007-2">
<link rel="stylesheet" href="css/reader.css?v=20261009-1">
<link rel="stylesheet" href="css/narrative-layers.css?v=20260827-34">
<link rel="stylesheet" href="css/cultural-layers.css?v=20260827-35">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">K</span><span class="brand-name">Truyện Kiều</span></a>
  <div class="search-wrap">
    <span aria-hidden="true">⌕</span>
    <input id="search" type="search" placeholder="Tìm câu thơ (gõ không dấu được) hoặc số câu…" aria-label="Tìm câu thơ hoặc nhập số câu">
    <kbd>/</kbd>
    <ul class="search-results" id="searchResults" hidden></ul>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="bookmarkToggle" type="button" title="Câu đã đánh dấu" aria-label="Câu đã đánh dấu">★<span class="badge" id="bookmarkCount"></span></button>
    <button class="icon-btn" id="themeToggle" type="button" data-theme-toggle title="Đổi nền sáng/tối" aria-label="Đổi nền sáng/tối">☾</button>
  </div>
  <div class="bookmarks" id="bookmarks" hidden>
    <h2>Câu đã đánh dấu</h2>
    <ul id="bookmarkList"></ul>
  </div>
</header>
<div class="progress-track"><div class="progress" id="progress"></div></div>

<main class="layout">
  <div class="status" id="status">
    <p id="statusText">Đang tải văn bản Truyện Kiều…</p>
    <button class="btn" id="retry" hidden>Thử lại</button>
  </div>

  <div class="reader" id="reader" hidden>
    <section class="poem-card" aria-labelledby="pageLabel">
      <div class="card-head" id="readerTop">
        <div>
          <p class="eyebrow">Nguyễn Du · Đoạn trường tân thanh</p>
          <h1 id="pageLabel">Câu 1–24</h1>
        </div>
        <button class="btn ghost" id="readPage">🔊 Đọc trang này</button>
      </div>
      <p class="speech-note" id="speechNote" hidden></p>
      <div class="verses" id="verses"></div>
      <nav class="pager" aria-label="Chuyển trang">
        <button class="btn" id="prevPage" aria-label="Trang trước">← Trước</button>
        <select id="pageSelect" aria-label="Chọn trang"></select>
        <button class="btn" id="nextPage" aria-label="Trang sau">Sau →</button>
      </nav>
      <p class="source-note" id="sourceNote"></p>
    </section>

    <aside class="notes-col" aria-label="Chú giải">
      <div class="reader-insight-row narrative-layer psychology-layer psychology-card" id="psychology" hidden></div>
      <div id="notes"></div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <p class="site-footer-note">Bấm vào câu có chấm màu để xem chú giải.<span class="shortcuts"> Phím tắt: <kbd>←</kbd> <kbd>→</kbd> chuyển trang · <kbd>/</kbd> tìm kiếm.</span></p>

    <a class="projects-link" href="https://tuongphanbase.github.io/emailer-dashboard/projects.html">Các dự án khác</a>
  </nav>
</footer>

<script src="js/narrative-layers.js?v=20260827-34"></script>

<script src="js/cultural-layers.js?v=20260827-35"></script>
</body>
</html>
